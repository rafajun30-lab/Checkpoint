version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: meteo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meteo_db
    ports:
      - "5432:5432"
    volumes:
      - meteo_pgdata:/var/lib/postgresql/data

volumes:
  meteo_pgdata:
